<!doctype html>
<html lang="zh-CN"><head><meta name="collection-api" content="https://hanzi-writing-lab-20261030.siqixuaz.chatgpt.site"><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f4ee"><title>字迹 · 汉字书写数据采集</title><style>:root{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#29382f;background:#f6f4ee;font-synthesis:none}*{box-sizing:border-box}body{margin:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}header,main{max-width:1600px;margin:auto;padding:0 24px}header{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 28px serif;text-decoration:none;letter-spacing:3px}.brand span{font:13px sans-serif;letter-spacing:1px;margin-left:18px;color:#7a8378}a{color:#365740}.brief{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}h1{font-size:15px;font-weight:500;margin:0}.input-mode{font-size:12px;color:#7a8378}.workspace{background:#fffefa;border:1px solid #dde1d6;border-radius:8px;padding:14px}.toolbar,.actions,.paper-foot,.dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar{padding-bottom:12px}.toolbar>div{display:flex;gap:8px}button{font:inherit;font-size:13px;cursor:pointer;color:inherit;border:1px solid #d5dbd0;border-radius:5px;background:#fffefa;padding:10px 15px}button:hover{background:#eaf0e7}button:disabled{opacity:.45;cursor:default}.primary{background:#365740;color:#fff;border-color:#365740}.primary:hover{background:#294530}.consent-link{color:#a62323;border-color:#dc9c93;background:#fff0ee;font-weight:600}.paper-wrap{position:relative;overflow:hidden;border:1px solid #e4e5db;background:#fff}canvas{display:block;width:100%;height:auto;aspect-ratio:5/7;background:#fff;touch-action:none}.paper-wrap,.paper-wrap *{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}#placeholder{position:absolute;top:18%;width:100%;text-align:center;pointer-events:none;font:20px serif;color:#b4bdaf}.paper-foot{padding-top:12px;font-size:11px;color:#84907e}.paper-foot b{font-weight:500}.message{font-size:12px;color:#73816e;line-height:1.8;margin:8px 0 0}.message.error{color:#a54732}footer{display:flex;justify-content:space-between;padding:16px 0 22px;font-size:11px;color:#84907e}dialog{border:1px solid #dccdc7;border-radius:12px;width:min(560px,calc(100% - 32px));max-height:calc(100dvh - 32px);padding:24px;background:#fffefa;color:inherit;overflow:auto;box-shadow:0 20px 80px #1d302930}dialog::backdrop{background:#24372c70}dialog h2{font:600 19px sans-serif;color:#a62323;margin:0 0 16px}.consent-body{font-size:13px;line-height:1.9;max-height:45dvh;overflow:auto;padding-right:8px;overscroll-behavior:contain}.consent-body p{margin:0 0 12px}.consent{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.8;margin:20px 0}.consent input{flex-shrink:0;margin-top:5px;accent-color:#365740}.dialog-actions{justify-content:flex-end}.consent-body,.message{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}body.is-writing,body.is-writing *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}body:has(dialog[open]){overflow:hidden}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b89155;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){header,main{padding-left:10px;padding-right:10px}header{height:58px}.brand{font-size:25px}.brand span{margin-left:10px}.brief{align-items:flex-start;padding-bottom:12px;flex-direction:column;gap:5px}h1{font-size:13px}.input-mode{font-size:10px}.workspace{padding:8px}.toolbar,.toolbar>div{gap:5px}button{font-size:12px;padding:9px 10px}.toolbar{padding-bottom:8px}footer{font-size:10px;gap:12px}dialog{padding:18px}.consent-body{max-height:48dvh}}</style></head>
<body><header><a class="brand" href="./">字迹<span>自由书写</span></a><button id="openConsent" class="consent-link">知情同意</button></header>
<main><div class="brief"><h1>只写汉字，不写标点</h1><span class="input-mode">主动笔模式（过滤手指）</span></div>
<section class="workspace" aria-label="书写区域"><div class="toolbar"><div><button id="undo">↶ 撤销</button><button id="clear">清空</button></div><div class="actions"><button id="download">下载备份</button><button id="submit" class="primary">整篇提交 ↗</button></div></div>
<div class="paper-wrap"><canvas id="paper" width="1000" height="1400" aria-label="无格自由书写画布"></canvas><div id="placeholder">在这里自由书写</div></div>
<div class="paper-foot"><span><b id="strokeCount">0</b> 笔<span hidden> · <b id="pointCount">0</b> 个采样点</span></span><span id="saveState" role="status">准备就绪</span><span id="pressureStatus" hidden></span></div><p id="message" class="message" role="status" aria-live="polite">写完后整篇提交。</p><button id="newSession" hidden>开始新的一篇</button></section>
<footer><span>南京师范大学教育科学学院汉字书写项目组</span><a href="https://hanzi-writing-lab-20261030.siqixuaz.chatgpt.site/admin">研究者入口</a></footer></main>
<dialog id="consentDialog" aria-labelledby="consentTitle"><h2 id="consentTitle">书写数据采集 · 知情同意</h2><div class="consent-body"><p id="consentText">正在加载说明…</p><p>请使用主动笔自由书写汉字，不写标点和个人信息。</p><p>本页面面向成年人；未成年人请先联系项目组安排监护人同意。</p><p>负责人：南京师范大学教育科学学院汉字书写项目组<br>联系：<a href="mailto:zhuqinchi@nnu.edu.cn">zhuqinchi@nnu.edu.cn</a></p></div><label class="consent"><input id="consent" type="checkbox"><span>我已阅读以上说明，符合参与条件，并自愿参与。</span></label><div class="dialog-actions"><button id="consentDecline">暂不参与</button><button id="consentConfirm" class="primary" disabled>同意并开始书写</button></div></dialog><script>const $ = id => document.getElementById(id);
const canvas = $('paper'), ctx = canvas.getContext('2d');
const API_BASE = document.querySelector('meta[name="collection-api"]')?.content || location.origin;
const apiUrl = path => new URL(path, API_BASE).href;
const W = 1000, H = 1400, VERSION = '1.0.0', KEY = 'current';
let config, db, active = null, rect, frozen = false, saving = Promise.resolve(), timer, clockOffset=0;
let state = fresh();
let consentAccepted=false;
const consentDialog=$('consentDialog');
function showConsent(){if(active)return;if(!consentDialog.open)consentDialog.showModal();refreshConsent();}
function refreshConsent(){$('consentConfirm').disabled=!config||!$('consent').checked;}
$('openConsent').onclick=showConsent;
$('consent').onchange=()=>{if(!$('consent').checked)consentAccepted=false;refreshConsent();update();};
$('consentConfirm').onclick=()=>{if(!config||!$('consent').checked)return;consentAccepted=true;consentDialog.close();update();};
$('consentDecline').onclick=()=>{consentAccepted=false;$('consent').checked=false;consentDialog.close();message('阅读并同意后即可书写。');update();};
consentDialog.addEventListener('cancel',()=>{if(!consentAccepted)$('consent').checked=false;});
function fresh() { return { schemaVersion: VERSION, submissionId: crypto.randomUUID(), createdAt: new Date().toISOString(), timeOrigin: performance.timeOrigin, coordinate_space: {unit:'logical_px',width:W,height:H,origin:'top-left',xDirection:'right',yDirection:'down',normalized:false}, strokes:[], edits:{undo:0,clear:0}, receipt:null }; }
function message(s, error=false) { $('message').textContent=s; $('message').classList.toggle('error',error); }
function openDB() {return new Promise((resolve,reject)=>{const r=indexedDB.open('hanzi-writing-collector',1);r.onupgradeneeded=()=>r.result.createObjectStore('drafts');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function dbRequest(mode, action) {return new Promise((resolve,reject)=>{const tx=db.transaction('drafts',mode),req=action(tx.objectStore('drafts'));let result;req.onsuccess=()=>{result=req.result;};tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
function persist() {if(!db)return;const snapshot=structuredClone(state);saving=saving.catch(()=>{}).then(()=>dbRequest('readwrite',s=>s.put(snapshot,KEY)));saving.then(()=>$('saveState').textContent='已保存到本机',()=>{$('saveState').textContent='本机保存失败';message('本机存储不可用，请立即下载备份，避免关闭页面后丢失。',true);});return saving;}
function drawStroke(stroke) {const pts=stroke.points;if(!pts.length)return;ctx.strokeStyle='#263d32';ctx.fillStyle='#263d32';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,1.25,0,Math.PI*2);ctx.fill();}}
function render() {ctx.clearRect(0,0,W,H);state.strokes.forEach(drawStroke);update();}
function update() {const n=state.strokes.reduce((s,x)=>s+x.points.length,0);$('strokeCount').textContent=state.strokes.length;$('pointCount').textContent=n;$('placeholder').hidden=n>0;$('undo').disabled=frozen||!state.strokes.length||!!active;$('clear').disabled=frozen||!state.strokes.length||!!active;$('submit').disabled=frozen||!config||!consentAccepted||!state.strokes.length||!!active;$('openConsent').disabled=!!active;$('newSession').hidden=!state.receipt;}
function point(e,type) {const pts=active.points, prev=pts.at(-1);const x=Math.min(W,Math.max(0,(e.clientX-rect.left)*W/rect.width)),y=Math.min(H,Math.max(0,(e.clientY-rect.top)*H/rect.height));const t=e.timeStamp+clockOffset, dt=prev?t-prev.t:0;const v=prev&&dt>0?Math.hypot(x-prev.x,y-prev.y)/(dt/1000):null;return {x,y,t,eventTimeStamp:e.timeStamp,timestamp:state.timeOrigin+t,dotType:type,pressure:Number.isFinite(e.pressure)?e.pressure:null,speed:v,pressureEstimated:v===null?null:1/(1+v/1000),tiltX:Number.isFinite(e.tiltX)?e.tiltX:null,tiltY:Number.isFinite(e.tiltY)?e.tiltY:null};}
function append(e,type) {const p=point(e,type),prev=active.points.at(-1);if(prev&&p.t<prev.t)return;if(type===1&&prev&&p.t===prev.t&&p.x===prev.x&&p.y===prev.y&&p.pressure===prev.pressure)return;active.points.push(p);if(prev){ctx.strokeStyle='#263d32';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();}else drawStroke(active);}
// Safari's native text selection/callout can take the pointer away from the paper.
// Touch listeners only suppress browser gestures; samples still come from Pointer Events.
const paperWrap=canvas.closest('.paper-wrap');
function clearSelection(){const selection=window.getSelection();if(selection?.rangeCount)selection.removeAllRanges();}
function protectPaper(e){if(active||paperWrap.contains(e.target)){if(e.cancelable)e.preventDefault();}}
for(const type of ['selectstart','contextmenu','dragstart'])document.addEventListener(type,protectPaper,{capture:true});
for(const type of ['touchstart','touchmove'])document.addEventListener(type,protectPaper,{capture:true,passive:false});
canvas.addEventListener('mousedown',protectPaper);
document.addEventListener('selectionchange',()=>{if(active)clearSelection();});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(frozen||active)return;if(!consentAccepted||consentDialog.open){showConsent();return;}if(e.pointerType!=='pen')return;if(e.button!==0)return;clearSelection();document.body.classList.add('is-writing');rect=canvas.getBoundingClientRect();active={id:state.strokes.length+1,pointerType:e.pointerType,status:'in_progress',display:{width:rect.width,height:rect.height,devicePixelRatio:devicePixelRatio},points:[]};state.strokes.push(active);active.pointerId=e.pointerId;canvas.setPointerCapture(e.pointerId);append(e,0);$('pressureStatus').textContent='记录浏览器压力原值';$('saveState').textContent='正在书写';update();timer=setInterval(persist,2000);});
canvas.addEventListener('pointermove',e=>{if(!active||e.pointerId!==active.pointerId)return;e.preventDefault();const samples=e.getCoalescedEvents?.()||[];for(const s of samples.length?samples:[e])append(s,1);});
function end(e,cancelled=false) {if(!active||e.pointerId!==active.pointerId)return;if(!cancelled)append(e,2);active.status=cancelled?'cancelled':'complete';delete active.pointerId;active=null;document.body.classList.remove('is-writing');clearInterval(timer);persist();update();if(cancelled)message('这一笔被设备中断，请撤销后重写，完整后才能提交。',true);}
canvas.addEventListener('pointerup',e=>end(e));canvas.addEventListener('pointercancel',e=>end(e,true));canvas.addEventListener('lostpointercapture',e=>end(e,true));
window.addEventListener('resize',()=>{if(!active)return;const next=canvas.getBoundingClientRect();if(['left','top','width','height'].some(key=>Math.abs(next[key]-rect[key])>.5))end({pointerId:active.pointerId},true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)end({pointerId:active.pointerId},true);});
window.addEventListener('beforeunload',e=>{if(state.strokes.length&&!state.receipt){e.preventDefault();e.returnValue='';}});

$('undo').onclick=()=>{if(active||frozen)return;state.strokes.pop();state.edits.undo++;render();persist();message('已撤销最后一笔。');};
$('clear').onclick=()=>{if(active||frozen||!confirm('清空整篇笔迹？建议先下载备份。'))return;state.strokes=[];state.edits.clear++;render();persist();message('可以重新书写。');};
function payload() {const {pendingPayload,receipt,...draft}=state;return pendingPayload||{...draft,completedAt:new Date().toISOString(),consent:{version:config?.consentVersion||'unloaded',text:config?.consentText||'',accepted:consentAccepted},collectionMode:config?.collectionMode||'test',pressurePolicy:{raw:'browser-reported-unverified',estimated:'1/(1+speed/1000); speed in logical_px/s; not physical pressure'},sampling:{events:'Pointer Events; coalesced samples where available; no predicted points',timestamp:'t = event.timeStamp in ms relative to timeOrigin; timestamp = timeOrigin+t'}};}
function download(obj,name) {const url=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('download').onclick=()=>download(payload(),'handwriting-'+state.submissionId+'.json');
$('submit').onclick=async()=>{if(active||frozen)return;if(!consentAccepted||consentDialog.open)return message('请先勾选知情同意。',true);if(state.strokes.some(s=>s.status!=='complete'))return message('有被中断的笔画，请撤销后重写。',true);if(state.strokes.reduce((n,s)=>n+s.points.length,0)>50000)return message('本篇超过50000点，请先下载备份，再减少笔画或分篇提交。',true);if(new Blob([JSON.stringify(payload())]).size>16*1024*1024)return message('本篇超过16MB，请先下载备份，再分篇提交。',true);if(!confirm('确认完成整篇书写并上传？提交后本篇将锁定。'))return;frozen=true;update();message('正在提交整篇笔迹，请稍候…');try{if(!state.pendingPayload){state.pendingPayload=payload();await persist();}const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),45000);let r;try{r=await fetch(apiUrl('/api/submissions'),{credentials:'omit',method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.pendingPayload),signal:ctl.signal});}finally{clearTimeout(timeout);}const data=await r.json();if(!r.ok)throw new Error(data.error||'提交失败');state.receipt=data;await persist();message('整篇提交成功。回执编号：'+data.id+'。请保存此编号，以便查询或撤回。');$('saveState').textContent='服务器已确认';}catch(e){frozen=false;message('未收到提交确认：'+e.message+'。笔迹仍在本机，可下载备份或重试。',true);}update();pendingLock();};
// A pending submission remains immutable on retries, including when the first response was lost.
function pendingLock() {if(state.pendingPayload&&!state.receipt){frozen=true;update();$('submit').disabled=false;$('submit').textContent='重试整篇提交';message('发现待确认提交。请重试，或先下载备份后开始新的一篇。');$('newSession').hidden=false;$('newSession').textContent='放弃待确认状态，开始新篇';$('submit').onclick=retryPending;}}
async function retryPending(){if(!consentAccepted||consentDialog.open)return message('请重新阅读并勾选知情同意。',true);frozen=false;const handler=originalSubmit;await handler();pendingLock();}
const originalSubmit=$('submit').onclick;
$('newSession').onclick=async()=>{if(!confirm('开始新的一篇？请先保存原篇备份和回执。'))return;state=fresh();clockOffset=0;frozen=false;$('submit').onclick=originalSubmit;$('submit').innerHTML='完成书写，整篇提交 ↗';$('consent').checked=false;consentAccepted=false;render();await persist();message('新篇已准备好。');showConsent();};
async function init(){try{db=await openDB();const draft=await dbRequest('readonly',s=>s.get(KEY));if(draft?.schemaVersion===VERSION){state=draft;for(const s of state.strokes)if(s.status==='in_progress'){s.status='cancelled';delete s.pointerId;}clockOffset=Math.max(performance.timeOrigin-state.timeOrigin,(state.strokes.at(-1)?.points.at(-1)?.t||0)+1-performance.now());frozen=!!state.receipt;render();if(state.receipt)message('本篇已提交，回执编号：'+state.receipt.id);else if(state.strokes.length)message('已恢复本机草稿。请重新确认知情同意后继续。');}}catch{message('本机草稿功能不可用。请在关闭页面前下载备份。',true);}try{const r=await fetch(apiUrl('/api/config'),{credentials:'omit'});if(!r.ok)throw new Error();config=await r.json();$('consentText').textContent=config.consentText;refreshConsent();if(config.collectionMode==='test')message('当前为测试站，仅用于试写与验证。正式采集请使用项目组确认的部署地址。');}catch{$('consentText').textContent='说明加载失败，请刷新后重试。';message('无法加载采集配置，可以下载备份，暂时不能提交。',true);}update();pendingLock();}
showConsent();
init();
</script></body></html>
