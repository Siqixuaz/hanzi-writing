per-foot{padding-top:12px;font-size:11px;color:#84907e}.paper-foot b{font-weight:500}.message{font-size:12px;color:#73816e;line-height:1.8;margin:8px 0 0}.message.error{color:#a54732}footer{display:flex;justify-content:space-between;padding:16px 0 22px;font-size:11px;color:#84907e}dialog{border:1px solid #dccdc7;border-radius:12px;width:min(560px,calc(100% - 32px));max-height:calc(100dvh - 32px);padding:24px;background:#fffefa;color:inherit;overflow:auto;box-shadow:0 20px 80px #1d302930}dialog::backdrop{background:#24372c70}dialog h2{font:600 19px sans-serif;color:#a62323;margin:0 0 16px}.consent-body{font-size:13px;line-height:1.9;max-height:45dvh;overflow:auto;padding-right:8px;overscroll-behavior:contain}.consent-body p{margin:0 0 12px}.consent{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.8;margin:20px 0}.consent input{flex-shrink:0;margin-top:5px;accent-color:#365740}.dialog-actions{justify-content:flex-end}.consent-body,.message{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}body.is-writing,body.is-writing *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}body:has(dialog[open]){overflow:hidden}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b89155;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){header,main{padding-left:10px;padding-right:10px}header{height:58px}.brand{font-size:25px}.brand span{margin-left:10px}.brief{align-items:flex-start;padding-bottom:12px;flex-direction:column;gap:5px}h1{font-size:13px}.input-mode{font-size:10px}.workspace{padding:8px}.toolbar,.toolbar>div{gap:5px}button{font-size:12px;padding:9px 10px}.toolbar{padding-bottom:8px}footer{font-size:10px;gap:12px}dialog{padding:18px}.consent-body{max-height:48dvh}}

html{height:100%}body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header,main{max-width:none;width:100%;margin:0;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}header{height:54px;flex-shrink:0}main{flex:1;min-height:0;display:flex;flex-direction:column}.brief{flex-shrink:0;padding:4px 0 10px}.workspace{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px}.toolbar{flex-shrink:0;padding-bottom:8px}.paper-wrap{flex:1;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}.paper-foot,.message{flex-shrink:0}footer{flex-shrink:0;padding:8px 0;font-size:10px}#placeholder{top:40%}.message{white-space:normal}@media(max-width:600px){header{height:48px}.brief{gap:3px;padding-bottom:7px}.workspace{padding:6px}.paper-foot{padding-top:6px}.message{margin-top:4px;font-size:11px}footer{padding:5px 0}}

<body><header><a class="brand" href="./">字迹<span>自由书写</span></a><button id="openConsent" class="consent-link">知情同意</button></header>
<main><div class="brief"><h1>只写汉字，不写标点</h1><span class="input-mode">主动笔模式（过滤手指）</span></div>
<section class="workspace" aria-label="书写区域"><div class="toolbar"><div><button id="undo">↶ 撤销</button><button id="clear">清空</button></div><div class="actions"><button id="download" class="primary">下载笔迹</button></div></div>
<div class="paper-wrap"><canvas id="paper" width="1000" height="1400" aria-label="无格自由书写画布"></canvas><div id="placeholder">在这里自由书写</div></div>
<div class="paper-foot"><span><b id="strokeCount">0</b> 笔<span hidden> · <b id="pointCount">0</b> 个采样点</span></span><span id="saveState" role="status">准备就绪</span><span id="pressureStatus" hidden></span></div><p id="message" class="message" role="status" aria-live="polite">笔迹仅保存在本机。</p></section>
<footer><span>南京师范大学教育科学学院汉字书写项目组</span><span>本机下载 JSON</span></footer></main>
<dialog id="consentDialog" aria-labelledby="consentTitle"><h2 id="consentTitle">书写数据采集 · 知情同意</h2><div class="consent-body"><p id="consentText">正在加载说明…</p><p>请使用主动笔自由书写汉字，不写标点和个人信息。</p><p>本页面面向成年人；未成年人请先联系项目组安排监护人同意。</p><p>负责人：南京师范大学教育科学学院汉字书写项目组<br>联系：<a href="mailto:zhuqinchi@nnu.edu.cn">zhuqinchi@nnu.edu.cn</a></p></div><label class="consent"><input id="consent" type="checkbox"><span>我已阅读以上说明，符合参与条件，并自愿参与。</span></label><div class="dialog-actions"><button id="consentDecline">暂不参与</button><button id="consentConfirm" class="primary" disabled>同意并开始书写</button></div></dialog><script id="studyConfig" type="application/json">{"collectionMode":"local","consentVersion":"2026-11-01-local-v1","consentText":"本页面由南京师范大学教育科学学院汉字书写项目组提供，用于汉字书写研究。网页仅在当前设备的浏览器中记录整篇笔迹，包括坐标、时间、浏览器报告的压力和输入显示尺寸，不自动上传或发送笔迹。点击下载后会生成JSON文件，由您自行选择保存位置，后续是否分享由您决定。网页不要求填写姓名、联系方式等个人资料，请不要书写标点或个人信息。参加自愿，可随时停止；本机草稿可通过清空笔迹或清理浏览器数据删除。当前页面面向成年人，未成年人请先联系项目组安排监护人同意。负责人：南京师范大学教育科学学院汉字书写项目组；联系邮箱：zhuqinchi@nnu.edu.cn。"}</script><script>const $ = id => document.getElementById(id);
const canvas=$('paper'),ctx=canvas.getContext('2d'),KEY='current',VERSION='1.0.0';
let config,db,active=null,rect,timer,clockOffset=0,consentAccepted=false,dirty=false,saving=Promise.resolve();
let view={scale:1,width:1,height:1,pixelRatio:1};
let state=fresh();
const consentDialog=$('consentDialog');
function fresh(){const width=Math.max(1,canvas.clientWidth),height=Math.max(1,canvas.clientHeight);return {schemaVersion:VERSION,submissionId:crypto.randomUUID(),createdAt:new Date().toISOString(),timeOrigin:performance.timeOrigin,coordinate_space:{unit:'logical_px',width,height,referenceWidth:width,referenceHeight:height,origin:'top-left',xDirection:'right',yDirection:'down',normalized:false},strokes:[],edits:{undo:0,clear:0}};}
function message(s,error=false){$('message').textContent=s;$('message').classList.toggle('error',error);}
function showConsent(){if(active)return;if(!consentDialog.open)consentDialog.showModal();refreshConsent();}
function refreshConsent(){$('consentConfirm').disabled=!config||!$('consent').checked;}
$('openConsent').onclick=showConsent;
$('consent').onchange=()=>{if(!$('consent').checked)consentAccepted=false;refreshConsent();update();};
$('consentConfirm').onclick=()=>{if(!config||!$('consent').checked)return;consentAccepted=true;consentDialog.close();update();};
$('consentDecline').onclick=()=>{consentAccepted=false;$('consent').checked=false;consentDialog.close();message('阅读并同意后即可书写。');update();};
consentDialog.addEventListener('cancel',()=>{if(!consentAccepted)$('consent').checked=false;});
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('hanzi-writing-collector',1);r.onupgradeneeded=()=>r.result.createObjectStore('drafts');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function dbRequest(mode,action){return new Promise((resolve,reject)=>{const tx=db.transaction('drafts',mode),req=action(tx.objectStore('drafts'));let result;req.onsuccess=()=>{result=req.result;};tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
function persist(){if(!db)return;const snapshot=structuredClone(state);saving=saving.catch(()=>{}).then(()=>dbRequest('readwrite',s=>s.put(snapshot,KEY)));saving.then(()=>$('saveState').textContent='已保存到本机',()=>{message('草稿保存失败，请下载笔迹。',true);});return saving;}
function drawStroke(stroke){const pts=stroke.points;if(!pts.length)return;ctx.strokeStyle=ctx.fillStyle='#263d32';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,1.25,0,Math.PI*2);ctx.fill();}}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(view.pixelRatio*view.scale,0,0,view.pixelRatio*view.scale,0,0);state.strokes.forEach(drawStroke);update();}
function fitCanvas(){const next=canvas.getBoundingClientRect();if(next.width<1||next.height<1)return;if(active&&rect&&['left','top','width','height'].some(k=>Math.abs(next[k]-rect[k])>.5))end({pointerId:active.pointerId},true);const c=state.coordinate_space;c.referenceWidth=c.referenceWidth||c.width;c.referenceHeight=c.referenceHeight||c.height;
  if(!state.strokes.length){c.referenceWidth=next.width;c.referenceHeight=next.height;}
  // Preserve raw coordinates and a uniform display scale when rotating/resizing.
  let requiredWidth=c.referenceWidth||c.width,requiredHeight=c.referenceHeight||c.height;
  for(const stroke of state.strokes)for(const p of stroke.points){requiredWidth=Math.max(requiredWidth,p.x+2);requiredHeight=Math.max(requiredHeight,p.y+2);}
  const scale=Math.min(next.width/requiredWidth,next.height/requiredHeight),pixelRatio=Math.min(devicePixelRatio||1,2);
  view={scale,width:next.width/scale,height:next.height/scale,pixelRatio};c.width=view.width;c.height=view.height;
  canvas.width=Math.max(1,Math.round(next.width*pixelRatio));canvas.height=Math.max(1,Math.round(next.height*pixelRatio));render();
}
function update(){const n=state.strokes.reduce((s,x)=>s+x.points.length,0);$('strokeCount').textContent=state.strokes.length;$('pointCount').textContent=n;$('placeholder').hidden=n>0;$('undo').disabled=!state.strokes.length||!!active;$('clear').disabled=!state.strokes.length||!!active;$('download').disabled=!state.strokes.length||!!active;$('openConsent').disabled=!!active;}
function point(e,type){const prev=active.points.at(-1),x=Math.min(view.width,Math.max(0,(e.clientX-rect.left)/view.scale)),y=Math.min(view.height,Math.max(0,(e.clientY-rect.top)/view.scale)),t=e.timeStamp+clockOffset,dt=prev?t-prev.t:0,v=prev&&dt>0?Math.hypot(x-prev.x,y-prev.y)/(dt/1000):null;return {x,y,t,eventTimeStamp:e.timeStamp,timestamp:state.timeOrigin+t,dotType:type,pressure:Number.isFinite(e.pressure)?e.pressure:null,speed:v,pressureEstimated:v===null?null:1/(1+v/1000),tiltX:Number.isFinite(e.tiltX)?e.tiltX:null,tiltY:Number.isFinite(e.tiltY)?e.tiltY:null};}
function append(e,type){const p=point(e,type),prev=active.points.at(-1);if(prev&&p.t<prev.t)return;if(type===1&&prev&&p.t===prev.t&&p.x===prev.x&&p.y===prev.y&&p.pressure===prev.pressure)return;active.points.push(p);dirty=true;if(prev){ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();}else drawStroke(active);}
const paperWrap=canvas.closest('.paper-wrap');
function clearSelection(){const s=getSelection();if(s?.rangeCount)s.removeAllRanges();}
function protectPaper(e){if(active||paperWrap.contains(e.target)){if(e.cancelable)e.preventDefault();}}
for(const type of ['selectstart','contextmenu','dragstart'])document.addEventListener(type,protectPaper,{capture:true});
for(const type of ['touchstart','touchmove'])document.addEventListener(type,protectPaper,{capture:true,passive:false});
canvas.addEventListener('mousedown',protectPaper);document.addEventListener('selectionchange',()=>{if(active)clearSelection();});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(active)return;if(!consentAccepted||consentDialog.open){showConsent();return;}if(e.pointerType!=='pen'||e.button!==0)return;clearSelection();document.body.classList.add('is-writing');rect=canvas.getBoundingClientRect();active={id:state.strokes.length+1,pointerType:'pen',status:'in_progress',display:{width:rect.width,height:rect.height,scale:view.scale,devicePixelRatio},points:[],pointerId:e.pointerId};state.strokes.push(active);canvas.setPointerCapture(e.pointerId);append(e,0);$('saveState').textContent='正在书写';update();timer=setInterval(persist,2000);});
canvas.addEventListener('pointermove',e=>{if(!active||e.pointerId!==active.pointerId)return;e.preventDefault();const samples=e.getCoalescedEvents?.()||[];for(const s of samples.length?samples:[e])append(s,1);});
function end(e,cancelled=false){if(!active||e.pointerId!==active.pointerId)return;if(!cancelled)append(e,2);active.status=cancelled?'cancelled':'complete';delete active.pointerId;active=null;document.body.classList.remove('is-writing');clearInterval(timer);persist();update();if(cancelled)message('这一笔被中断，可撤销重写；下载会保留中断标记。',true);}
canvas.addEventListener('pointerup',e=>end(e));canvas.addEventListener('pointercancel',e=>end(e,true));canvas.addEventListener('lostpointercapture',e=>end(e,true));
let resizeFrame;function scheduleFit(){cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(fitCanvas);}
new ResizeObserver(scheduleFit).observe(paperWrap);window.addEventListener('resize',scheduleFit);window.visualViewport?.addEventListener('resize',scheduleFit);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)end({pointerId:active.pointerId},true);});
window.addEventListener('beforeunload',e=>{if(dirty&&state.strokes.length){e.preventDefault();e.returnValue='';}});
$('undo').onclick=()=>{if(active)return;state.strokes.pop();state.edits.undo++;dirty=true;render();persist();message('已撤销最后一笔。');};
$('clear').onclick=()=>{if(active||!confirm('清空笔迹？请先下载需要保留的数据。'))return;state.strokes=[];state.edits.clear++;dirty=false;fitCanvas();persist();message('笔迹已清空。');};
function payload(){return {...state,completedAt:new Date().toISOString(),collectionMode:'local',consent:{version:config?.consentVersion||'',text:config?.consentText||'',accepted:consentAccepted},pressurePolicy:{raw:'browser-reported-unverified',estimated:'1/(1+speed/1000); not physical pressure'},sampling:{events:'Pointer Events; coalesced samples where available; no predicted points',timestamp:'t in ms relative to timeOrigin; timestamp=timeOrigin+t'}};}
$('download').onclick=()=>{if(active||!state.strokes.length)return;const url=URL.createObjectURL(new Blob([JSON.stringify(payload())],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='handwriting-'+state.submissionId+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);dirty=false;message('已生成 JSON，请确认保存到设备。');};
async function init(){try{config=JSON.parse($('studyConfig').textContent);if(!config.consentText)throw Error();$('consentText').textContent=config.consentText;refreshConsent();}catch{message('网页说明不完整，请联系项目组。',true);}
  try{db=await openDB();const draft=await dbRequest('readonly',s=>s.get(KEY));if(draft?.schemaVersion===VERSION){const original=draft.pendingPayload||draft;state={...original};delete state.pendingPayload;delete state.receipt;state.edits=state.edits||{undo:0,clear:0};for(const s of state.strokes)if(s.status==='in_progress'){s.status='cancelled';delete s.pointerId;}clockOffset=Math.max(performance.timeOrigin-state.timeOrigin,(state.strokes.at(-1)?.points.at(-1)?.t||0)+1-performance.now());dirty=!!state.strokes.length;if(dirty)message('已恢复本机笔迹，可继续书写或下载。');}}
  catch{message('本机草稿不可用，请及时下载。',true);}fitCanvas();
}
fitCanvas();showConsent();init();</script></body></html>
